    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Montserrat carries the entire site: body copy, navigation, UI and every
      heading. It is loaded as a variable font so display headings can sit at
      weight 200 at 100px+ and still be a single family rather than a
      different typeface pretending to be a heading face.
      Space Mono survives only as a micro-label voice (indices, eyebrows,
      metadata) -- the "instrument panel" register against Montserrat's warmth.
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200..800;1,200..700&family=Space+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!--
    Pin the cascade order before any other stylesheet is parsed. Layers are
    ordered by first appearance, and the Tailwind browser build injects its
    sheet at runtime -- so the only place this can be guaranteed is a plain
    <style> in the head, ahead of everything.

      theme < base < site < components < utilities

    `base`      Tailwind's preflight reset.
    `site`      the design system in src/styles/main.css (tokens, .wrap,
                .lead, .eyebrow, the universal reset).
    `components`per-component rules in App.vue and src/components/*.
    `utilities` Tailwind utility classes, which must always win.

    Without this, `site` would be appended after `utilities` and every
    bespoke class would silently beat the utility classes on the same element.
  -->
    <style>@layer theme,base,site,components,utilities;</style>

    <!--
    Tailwind theme tokens.

    `static` is load-bearing. By default the v4 compiler tree-shakes theme
    variables and only emits the ones referenced by a generated utility.
    This project's layout and typography are hand-written component CSS in
    src/styles/main.css and App.vue, which read these tokens directly via
    var(--color-ink) and friends -- but the templates deliberately contain
    zero utility classes, so nothing would reference them and the compiler
    would emit none of them. Every colour would then fall back to its
    initial value and the page would render unstyled. `static` forces the
    full token set to be emitted regardless of usage.
  -->
    <style type="text/tailwindcss">@theme static{ --color-ink: #0c1622; --color-ink-2: #111e2d; --color-ink-3: #16283a; --color-hull: #22384b; --color-brass: #e3a857; --color-brass-dim: #b9823f; --color-fog: #94a6b4; --color-paper: #eef2f4; --color-hair: #eef2f41c; --color-hair-strong: #eef2f433;  --font-display: "Montserrat", system-ui, -apple-system, sans-serif; --font-body: "Montserrat", system-ui, -apple-system, sans-serif; --font-mono: "Space Mono", ui-monospace, "SFMono-Regular", monospace; --spacing-gutter: 24px; --container-page: 1280px; --ease-standard: cubic-bezier(.22, 1, .36, 1);}</style>
